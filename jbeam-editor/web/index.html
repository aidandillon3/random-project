<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JBeam Editor</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<header id="topbar">
  <div class="brand">JBeam Editor</div>
  <label class="field">Vehicle <select id="vehicleSelect"></select></label>
  <label class="field">Config <select id="configSelect"></select></label>
  <button id="btnSaveConfig" title="Save the parts and tuning you picked as a .pc config">Save config…</button>
  <span class="sep"></span>
  <button id="btnUndo" title="Undo (Ctrl+Z)">↶ Undo</button>
  <button id="btnRedo" title="Redo (Ctrl+Y)">↷ Redo</button>
  <button id="btnSave" class="primary" title="Write your changes into the .jbeam files (Ctrl+S)">Save</button>
  <span class="sep"></span>
  <button id="btnImport" title="Load an .obj, .glb, .stl or .dae model to build a part from">Import 3D model…</button>
  <button id="btnCheck" title="Look for mistakes the game would complain about">Check</button>
  <button id="btnExport" title="Pack your mod folder into a zip you can share">Export mod…</button>
  <span class="grow"></span>
  <button id="btnSettings" title="BeamNG folders">Settings</button>
  <button id="btnHelp" title="How to use the editor">Help</button>
</header>

<main id="layout">
  <aside id="left" class="panel">
    <nav class="tabs" id="leftTabs">
      <button data-tab="parts" class="active">Parts</button>
      <button data-tab="tuning">Tuning</button>
      <button data-tab="info">Problems</button>
    </nav>
    <section class="tab" id="tab-parts">
      <input id="partSearch" type="search" placeholder="Find a slot or part…">
      <div id="partsTree"></div>
    </section>
    <section class="tab hidden" id="tab-tuning"><div id="tuning"></div></section>
    <section class="tab hidden" id="tab-info"><div id="problems"></div></section>
  </aside>

  <section id="center">
    <div id="toolbar">
      <div class="group" id="tools">
        <button data-tool="select" title="Select and move (Q): click, Shift+click to add, drag a box; drag the arrows to move">⬚ Select / move</button>
        <button data-tool="node" title="Add node (N): click where it goes">＋ Node</button>
        <button data-tool="beam" title="Connect (B): click two nodes to join them with a beam">⟋ Beam</button>
        <button data-tool="tri" title="Collision triangle (T): click three nodes">◺ Triangle</button>
      </div>
      <div class="group">
        <label class="chk" title="Edit left and right sides together (M)"><input type="checkbox" id="optMirror"> Mirror</label>
        <label class="field small" title="Snap moves to a grid">Snap
          <select id="optSnap"><option value="0">off</option><option value="0.005">5 mm</option><option value="0.01">1 cm</option><option value="0.05">5 cm</option><option value="0.1">10 cm</option></select>
        </label>
      </div>
      <div class="group" id="activePartBox" title="New nodes, beams and triangles are written into this part">
        <span>Adding to</span> <select id="activePart"></select>
        <label class="chk" title="Keep adding to this part even when you click nodes of other parts"><input type="checkbox" id="optPin"> Stay</label>
      </div>
      <div class="group right">
        <details class="viewmenu">
          <summary>View ▾</summary>
          <div class="menu">
            <label><input type="checkbox" id="vNodes" checked> Nodes</label>
            <label><input type="checkbox" id="vBeams" checked> Beams</label>
            <label><input type="checkbox" id="vTris" checked> Collision triangles</label>
            <label><input type="checkbox" id="vWheels" checked> Wheels</label>
            <label><input type="checkbox" id="vMesh" checked> 3D model</label>
            <label>Model opacity <input type="range" id="vMeshOpacity" min="0.05" max="1" step="0.05" value="0.35"></label>
            <label><input type="checkbox" id="vLabels" checked> Names of selected nodes</label>
            <label><input type="checkbox" id="vStability"> Colour nodes by stability</label>
            <label><input type="checkbox" id="vOnlyActive"> Only show the part I'm editing</label>
            <label>Node size <input type="range" id="vNodeSize" min="3" max="16" step="1" value="7"></label>
            <hr>
            <button data-view="front">Front (1)</button> <button data-view="side">Side (3)</button>
            <button data-view="top">Top (7)</button> <button data-view="all">Fit (Home)</button>
          </div>
        </details>
      </div>
    </div>
    <div id="viewport"></div>
    <div id="labels"></div>
    <div id="boxsel" class="hidden"></div>
    <div id="hint"></div>
    <div id="loading" class="hidden"><div class="spinner"></div><span id="loadingText">Loading…</span></div>
  </section>

  <aside id="right" class="panel">
    <section id="props"></section>
    <section id="weights"></section>
  </aside>
</main>

<footer id="status">
  <span id="statusLeft"></span>
  <span class="grow"></span>
  <span id="statusRight"></span>
</footer>

<div id="modal" class="hidden"><div class="box"><div class="head"><span id="modalTitle"></span><button id="modalClose" title="Close">✕</button></div><div id="modalBody"></div></div></div>
<div id="toasts"></div>
<input type="file" id="fileInput" class="hidden" accept=".obj,.glb,.gltf,.stl,.dae">

<script type="module" src="js/main.js"></script>
</body>
</html>
