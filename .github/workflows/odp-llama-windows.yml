# Builds IST-DASLab's disaggregated llama.cpp (ODP: a 1-bit Qwen3.8-27B decoder with its NVFP4 prefill
# weights streamed from the SSD) for Windows with CUDA, for RTX 50 cards (sm_120a). The fork publishes no
# Windows builds and reads its blocks with POSIX pread, which local-agent/odp/odp-windows.patch replaces.
# The zip goes to a pre-release of this repo, where the Local Agent app downloads it.
name: ODP llama.cpp for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - local-agent/odp/**
      - .github/workflows/odp-llama-windows.yml

permissions:
  contents: write

env:
  FORK: IST-DASLab/disaggregated-llama.cpp
  FORK_COMMIT: a0557fcf59e50a3bcd241e1a7de7b151d315720b
  CUDA: "13.4"
  ASSET: localagent-odp-llama-win-cuda-13.4-x64.zip
  # raise with every change to what's in the zip: the app replaces an installed build older than its odp.BUILD
  BUILD: "2"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Get the fork and patch it
        shell: bash
        run: |
          git init -q fork
          cd fork
          git remote add origin "https://github.com/$FORK"
          git fetch -q --depth 1 origin "$FORK_COMMIT"
          git checkout -q FETCH_HEAD
          git apply --verbose ../local-agent/odp/odp-windows.patch

      - name: Install the CUDA toolkit
        uses: ./fork/.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ env.CUDA }}
          cuda_arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Build llama-server
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S fork -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ^
            -DGGML_NATIVE=OFF -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=120a ^
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
          if errorlevel 1 exit /b 1
          set /A JOBS=%NUMBER_OF_PROCESSORS%
          cmake --build build --config Release -j %JOBS% --target llama-server
          if errorlevel 1 exit /b 1

      - name: Pack it with every DLL it needs
        shell: pwsh
        run: |
          $out = "odp-llama"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build\bin\*.exe, build\bin\*.dll $out
          $vs = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC"
          $dumpbin = (Get-ChildItem "$vs\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1).FullName
          # where the DLLs it links come from: CUDA, OpenSSL (the server's https), and the MSVC runtime and
          # OpenMP, packed beside it so the PC needs no Visual C++ redistributable
          $cuda = Get-ChildItem $env:CUDA_PATH -Recurse -Filter *.dll | ForEach-Object DirectoryName | Sort-Object -Unique
          # (the runtime first: CUDA's tool folders carry their own older copies of it)
          $from = @(Get-ChildItem "$vs\Redist\MSVC\*\x64\Microsoft.VC143.CRT", "$vs\Redist\MSVC\*\x64\Microsoft.VC143.OpenMP" |
              Sort-Object FullName -Descending | ForEach-Object FullName) + @("C:\Program Files\OpenSSL\bin") + @($cuda)
          $missing = @()
          do {
            $added = 0
            foreach ($f in Get-ChildItem $out -Include *.exe, *.dll -Recurse) {
              $deps = & $dumpbin /nologo /dependents $f.FullName | ForEach-Object { $_.Trim() } |
                Where-Object { $_ -match "^[\w.\-]+\.dll$" }
              foreach ($d in $deps) {
                if (Test-Path "$out\$d") { continue }
                $hit = $from | ForEach-Object { Join-Path $_ $d } | Where-Object { Test-Path $_ } | Select-Object -First 1
                if ($hit) { Copy-Item $hit $out; $added++; Write-Host "packed $d (for $($f.Name)) from $hit"; continue }
                # Windows' own DLLs, and the NVIDIA driver's, are on every PC that can run it
                if (($d -match "^(api-ms-|ext-ms-)") -or ($d -eq "nvcuda.dll") -or (Test-Path "$env:WINDIR\System32\$d")) { continue }
                if ($missing -notcontains "$d (for $($f.Name))") { $missing += "$d (for $($f.Name))" }
              }
            }
          } while ($added -gt 0)
          $missing = $missing | Where-Object { -not (Test-Path ("$out\" + ($_ -split " ")[0])) }
          if ($missing) { throw "Not packed, so the engine wouldn't start: $($missing -join ', ')" }
          @{ fork = $env:FORK; commit = $env:FORK_COMMIT; cuda = $env:CUDA; built_from = $env:GITHUB_SHA; build = [int]$env:BUILD } |
            ConvertTo-Json | Set-Content "$out\BUILD.json"
          Get-ChildItem $out | Format-Table Name, Length
          Compress-Archive -Path "$out\*" -DestinationPath $env:ASSET

      - name: Publish the pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="odp-llama-b${BUILD}-${FORK_COMMIT:0:7}-${GITHUB_SHA:0:7}"
          gh release create "$tag" "$ASSET" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "ODP llama.cpp for Windows ($tag)" \
            --notes "llama-server from $FORK at $FORK_COMMIT with local-agent/odp/odp-windows.patch, CUDA $CUDA, sm_120a (RTX 50). Downloaded by the Local Agent app's 1-bit 27B mode."
